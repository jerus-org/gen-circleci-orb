sonar.projectKey=jerus-org_gen-circleci-orb
sonar.organization=jerus-org

# Source files are UTF-8 (em-dashes and set notation in doc comments, accented
# characters in generated orb snapshots). Without this the scanner defaults to
# US-ASCII and emits "Invalid character encountered" warnings.
sonar.sourceEncoding=UTF-8

# The Rust analyzer auto-runs `cargo clippy` unless told otherwise. It cannot
# succeed here: toolkit/security runs on the audit_env executor
# (resource_class: small — 1 vCPU / 2 GB) with no cargo cache, so the sensor
# cold-builds all 425 crates in Cargo.lock and rustc is OOM-killed
# ("(signal: 9, SIGKILL: kill)" -> "Clippy failed with exit code 101"). The
# scanner logs the error but still reports the sensor as done and exits 0, so
# the job goes green having contributed no Clippy findings at all.
#
# Clippy is already enforced in the same pipeline by toolkit/idiomatic_rust
# (`cargo clippy --all --tests --all-features -- -D warnings`) on a correctly
# sized, cached executor — so nothing is lost by disabling the sensor, and the
# green build stops being misleading.
#
# This is a stop-gap. The durable fix is to import the JSON report that
# idiomatic_rust already has the inputs for, via
# sonar.rust.clippyReport.reportPaths — tracked in jerus-org/circleci-toolkit.
sonar.rust.clippy.enabled=false

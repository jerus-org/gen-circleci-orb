description: 'Generate orb source files from a CLI binary''s --help output. Introspects the target binary (named by --binary or `[orb] binary`) via its own --help text, and (re)writes the full orb source tree (commands, jobs, scripts, executor, Dockerfile) under --output/--orb-dir. Safe to re-run: identical output is left untouched. Use --check in CI to gate on a drifted or hand-edited orb; --dry-run to preview with no writes.'
parameters:
  binary:
    type: string
    description: Name of the binary to introspect (must be on PATH). Falls back to `binary` in the `[orb]` section of gen-circleci-orb.toml.
    default: ''
  config:
    type: string
    description: Path to gen-circleci-orb.toml config file. Defaults to `<output>/gen-circleci-orb.toml` when not specified.
    default: ''
  output:
    type: string
    description: Project root directory (orb source is written to `<output>/<orb-dir>/`)
    default: .
  orb_dir:
    type: string
    description: Subdirectory within --output where orb source is written. Falls back to `orb_dir` in the `[orb]` section of gen-circleci-orb.toml, then "orb".
    default: ''
  orb_namespace:
    type: string
    description: CircleCI orb namespace(s) to publish the orb under (repeatable). Falls back to `namespaces` in the `[orb]` section of gen-circleci-orb.toml.
    default: ''
  home_url:
    type: string
    description: Home URL for the orb registry display section. Falls back to `home_url` in the `[orb]` section of gen-circleci-orb.toml.
    default: ''
  source_url:
    type: string
    description: Source URL for the orb registry display section. Falls back to `source_url` in the `[orb]` section of gen-circleci-orb.toml.
    default: ''
  install_method:
    type: enum
    description: How the binary is installed in the generated Docker image. Falls back to `install_method` in the `[orb]` section of gen-circleci-orb.toml, then "binstall".
    default: binstall
    enum:
    - binstall
    - apt
    - local
  base_image:
    type: string
    description: Base Docker image for the generated executor. Falls back to `base_image` in the `[orb]` section of gen-circleci-orb.toml, then "debian:13-slim".
    default: ''
  circleci_cli_version:
    type: string
    description: 'circleci-cli version to install in the generated Docker image executor (overrides `[orb].circleci_cli_version` and the built-in default). This controls the *version*, not *whether* the CLI is installed: the generator adds the cli-installer stage automatically whenever the wrapped binary exposes a circleci-using subcommand (e.g. `ensure-orb-registered`), at `DEFAULT_CIRCLECI_CLI_VERSION` when unset. Set this (or the config key) to pin a version, or to opt a binary in when auto-detection doesn''t apply.'
    default: ''
  apt_packages:
    type: string
    description: Extra apt package(s) to install in the final Docker image stage (repeatable). Combined with the baseline packages (ca-certificates, git) and sorted alphanumerically. Pass the flag once per package to add more than one.
    default: ''
  cargo_tool:
    type: string
    description: Extra cargo tool(s) to install into the executor image (repeatable). Each is a crate name installed via cargo-binstall in the builder stage, with its binary copied into the runtime, or "crate:binary" when the installed binary name differs from the crate name. Binstall install method only. Pass the flag once per tool to add more than one.
    default: ''
  git_push_subcommand:
    type: string
    description: Subcommand name(s) whose generated jobs should include a set_https_remote step (repeatable). Use for subcommands that push to git, e.g. --git-push-subcommand save.
    default: ''
  dry_run:
    type: boolean
    description: Show planned output without writing any files
    default: false
  no_record:
    type: boolean
    description: Suppress auto-record for this run, even when `[record].enabled = true` in gen-circleci-orb.toml. Auto-record commits the regenerated orb source back to the current branch (GPG-signed) and pushes it, so the published orb always reflects the CLI. Whether to record, and the names of the env vars holding the signing material, are config-driven (the `[record]` section). Use this flag for local, test, and dry runs where no signing material is available.
    default: false
  check:
    type: boolean
    description: 'Verify mode: regenerate the orb and compare it to the committed files, writing nothing and never recording. Exits non-zero if any file would be created, updated, or removed — i.e. the committed orb is out of sync with the CLI. Use this to gate packing/publishing so a drifted or hand-edited orb is never published.'
    default: false
  allow_main_record:
    type: boolean
    description: Allow auto-record to push to `main`. A narrow, explicit relaxation of the default main-exclusion (see `should_record_on_branch`) — only for the post-merge-regen chain (gen-circleci-orb#328), which has already switched CIRCLE_BRANCH onto `main` itself via `--target-branch`. Never set this for an ordinary `generate --record` run.
    default: false
steps:
- when:
    condition: << parameters.dry_run >>
    steps:
    - run:
        name: Set GCO_DRY_RUN flag
        command: echo 'export GCO_DRY_RUN=true' >> "$BASH_ENV"
- when:
    condition: << parameters.no_record >>
    steps:
    - run:
        name: Set GCO_NO_RECORD flag
        command: echo 'export GCO_NO_RECORD=true' >> "$BASH_ENV"
- when:
    condition: << parameters.check >>
    steps:
    - run:
        name: Set GCO_CHECK flag
        command: echo 'export GCO_CHECK=true' >> "$BASH_ENV"
- when:
    condition: << parameters.allow_main_record >>
    steps:
    - run:
        name: Set GCO_ALLOW_MAIN_RECORD flag
        command: echo 'export GCO_ALLOW_MAIN_RECORD=true' >> "$BASH_ENV"
- run:
    name: Generate orb source files from a CLI binary's --help output.
    command: <<include(scripts/generate.sh)>>
    environment:
      GCO_BINARY: << parameters.binary >>
      GCO_CONFIG: << parameters.config >>
      GCO_OUTPUT: << parameters.output >>
      GCO_ORB_DIR: << parameters.orb_dir >>
      GCO_ORB_NAMESPACE: << parameters.orb_namespace >>
      GCO_HOME_URL: << parameters.home_url >>
      GCO_SOURCE_URL: << parameters.source_url >>
      GCO_INSTALL_METHOD: << parameters.install_method >>
      GCO_BASE_IMAGE: << parameters.base_image >>
      GCO_CIRCLECI_CLI_VERSION: << parameters.circleci_cli_version >>
      GCO_APT_PACKAGES: << parameters.apt_packages >>
      GCO_CARGO_TOOL: << parameters.cargo_tool >>
      GCO_GIT_PUSH_SUBCOMMAND: << parameters.git_push_subcommand >>

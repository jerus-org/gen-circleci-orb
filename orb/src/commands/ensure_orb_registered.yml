description: 'Ensure a CircleCI orb is registered, creating it if it does not exist. A small CI-internal helper (not something a consumer normally runs by hand): the generated orb-release workflow calls this before `orb-tools/publish` so the very first publish of a brand-new orb namespace/name doesn''t fail on a missing orb. Idempotent — a no-op once the orb already exists.'
parameters:
  orb_name:
    type: string
    description: The orb name to check/register (e.g. my-org/my-orb)
  private:
    type: boolean
    description: Register the orb as private when creating it. Must be set correctly on first creation — orb visibility cannot be changed after the orb is created.
    default: false
steps:
- when:
    condition: << parameters.private >>
    steps:
    - run:
        name: Set GCO_PRIVATE flag
        command: echo 'export GCO_PRIVATE=true' >> "$BASH_ENV"
- run:
    name: Ensure a CircleCI orb is registered, creating it if it does not exist.
    command: <<include(scripts/ensure_orb_registered.sh)>>
    environment:
      GCO_ORB_NAME: << parameters.orb_name >>

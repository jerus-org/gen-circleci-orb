description: Re-sync an existing repo's orb-managed CI wiring to the current flow. Reads the committed gen-circleci-orb.toml (never overwrites it) and rewrites only the gen-circleci-orb-managed blocks in .circleci/config.yml, preserving the consumer's own jobs and customizations. Run with --check in CI to fail when the wiring is out of date relative to the pinned orb version. It also checks the arguments of every gen-circleci-orb job invocation in the CI files against the orb's job parameters, removing arguments a job no longer declares.
parameters:
  config:
    type: string
    description: Path to gen-circleci-orb.toml
    default: gen-circleci-orb.toml
  ci_dir:
    type: string
    description: Path to the .circleci/ directory
    default: .circleci
  check:
    type: boolean
    description: 'Verify mode: write nothing and exit non-zero when the CI wiring is out of date. Prints a diff and upgrade guidance. For use in CI.'
    default: false
steps:
- when:
    condition: << parameters.check >>
    steps:
    - run:
        name: Set GCO_CHECK flag
        command: echo 'export GCO_CHECK=true' >> "$BASH_ENV"
- run:
    name: Re-sync an existing repo's orb-managed CI wiring to the current flow.
    command: <<include(scripts/update.sh)>>
    environment:
      GCO_CONFIG: << parameters.config >>
      GCO_CI_DIR: << parameters.ci_dir >>

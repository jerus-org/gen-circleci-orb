description: >-
  Build a Rust binary (debug profile — the binary is only ever introspected
  via --help by downstream jobs, so optimization is unnecessary compute
  cost) from a workspace package and persist it to workspace for use in
  subsequent jobs.
parameters:
  package:
    type: string
    description: Cargo package name within the workspace (passed to --package)
  binary:
    type: string
    description: Binary target name if it differs from the package name; defaults to package name
    default: ''
  executor:
    type: executor
    default: rust_builder
    description: >-
      Executor to compile in. Defaults to this orb's own rust_builder
      executor (rust:latest) — sufficient for most consumers. Override for a
      crate needing extra build tooling (e.g. libclang for a bindgen-based
      `-sys` crate); recommended to match whatever executor the workspace's
      other test jobs already use.
  cargo_args:
    type: string
    description: Additional arguments passed to cargo build
    default: ''
  resource_class:
    type: string
    default: medium
    description: >-
      CircleCI resource class. Declared explicitly rather than relying on the
      platform default (which is "subject to change" per CircleCI docs).
      `medium` (2 vCPU / 4 GB) suits most cargo builds; override to a larger
      class if a heavy workspace OOMs.
resource_class: << parameters.resource_class >>
executor: << parameters.executor >>
steps:
  - checkout
  - build_rust_binary:
      package: << parameters.package >>
      binary: << parameters.binary >>
      cargo_args: << parameters.cargo_args >>

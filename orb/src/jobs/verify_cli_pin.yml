description: Smoke-test the pinned circleci-cli by building only the Dockerfile's cli-installer stage -- catches a broken [orb].circleci_cli_version pin at PR time, not just at release time (gen-circleci-orb#326/#328).
resource_class: small
docker:
  - image: cimg/base:stable
parameters:
  orb_dir:
    type: string
    description: Directory containing the Dockerfile
    default: orb
steps:
  - checkout
  - verify_cli_pin:
      orb_dir: << parameters.orb_dir >>

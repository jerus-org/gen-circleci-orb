version: 2.1

parameters:
  min_rust_version:
    type: string
    default: "1.89"

orbs:
  toolkit: jerus-org/circleci-toolkit@7.4.0
  orb-tools: circleci/orb-tools@12.5.0
  # Consumed by the orb-release workflow's build_mcp_server job (Mechanism A:
  # gen-orb-mcp owns the MCP build). Declared here (not in a managed block) so
  # `update` skips re-inserting it and stays round-trip stable.
  gen-orb-mcp: jerus-org/gen-orb-mcp@0.2.3
  # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
  gen-circleci-orb: jerus-org/gen-circleci-orb@0.1.13
  # <<< gen-circleci-orb
workflows:
  validation:
    jobs:
      - toolkit/verify_commit_signatures:
          name: verify_commit_signatures_trusted
          context: bot-check
          post_comment: true
          update_pcu: false
          filters:
            branches:
              ignore:
                - main
                - /pull\/[0-9]+/
      - toolkit/verify_commit_signatures:
          name: verify_commit_signatures_forked
          post_comment: false
          update_pcu: false
          filters:
            branches:
              only: /pull\/[0-9]+/
      - toolkit/required_builds:
          min_rust_version: << pipeline.parameters.min_rust_version >>
      - toolkit/optional_builds:
          filters:
            branches:
              ignore: main
      - toolkit/idiomatic_rust:
          clippy_report: true
      - toolkit/common_tests:
          min_rust_version: << pipeline.parameters.min_rust_version >>
      - toolkit/security:
          name: security audit only
          sonarcloud: false
          filters:
            branches:
              only: /pull\/[0-9]+/
      - toolkit/security:
          name: security with sonarcloud
          clippy_report: true
          context: SonarCloud
          requires: 
            - toolkit/idiomatic_rust
          filters:
            branches:
              ignore: /pull\/[0-9]+/
      - toolkit/code_coverage:
          package: gen-circleci-orb
          filters:
            branches:
              ignore:
                - /pull\/[0-9]+/
                - main
          requires:
            - security with sonarcloud
      # test_generation = false (gen-circleci-orb.toml): the generation
      # self-test chain (build-binary -> regenerate-orb -> pack-orb ->
      # review-orb) is omitted — this repo no longer builds and runs an
      # unreleased binary as a gating CI step (#367). Generation correctness
      # is instead proven by cargo test's fixture-cli/generate_fixture
      # coverage. check-ci-wiring (gen-circleci-orb/update --check) still
      # runs unconditionally: it validates this file's wiring against
      # gen-circleci-orb.toml using the container's own pinned CLI — a pure
      # text diff, unrelated to generation-content validity.
      # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
      - gen-circleci-orb/update:
          name: check-ci-wiring
          check: true
          filters:
            branches:
              ignore:
                - main
      # <<< gen-circleci-orb

  # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
  orb-release:
    jobs:
      - orb-tools/pack:
          name: orb-release-pack
          checkout: false
          source_dir: orb/src
          pre-steps:
            - checkout
            - run:
                name: Inject release version into executor default tag
                command: |
                  VERSION=${CIRCLE_TAG#gen-circleci-orb-v}
                  echo "Injecting version: ${VERSION}"
                  sed -i "s/default: latest/default: ${VERSION}/" orb/src/executors/default.yml
                  echo "Updated executor:"
                  cat orb/src/executors/default.yml
          filters:
            tags:
              only: /^gen-circleci-orb-v.*/
            branches:
              ignore: /.*/

      - gen-circleci-orb/build_container:
          name: orb-release-container
          binary: gen-circleci-orb
          docker_namespace: jerusdp
          orb_dir: orb
          crate_tag_prefix: gen-circleci-orb-v
          context: [docker]
          filters:
            tags:
              only: /^gen-circleci-orb-v.*/
            branches:
              ignore: /.*/

      - gen-circleci-orb/ensure_orb_registered:
          name: orb-release-ensure-registered-jerus-org
          orb_name: jerus-org/gen-circleci-orb
          context: [orb-publishing]
          filters:
            tags:
              only: /^gen-circleci-orb-v.*/
            branches:
              ignore: /.*/

      - orb-tools/publish:
          name: publish-orb-jerus-org
          pre-steps:
            - run:
                name: Normalize CIRCLE_TAG for orb version
                command: |
                  VERSION=${CIRCLE_TAG#gen-circleci-orb-v}
                  echo "export CIRCLE_TAG=v${VERSION}" >> "$BASH_ENV"
          orb_name: jerus-org/gen-circleci-orb
          pub_type: production
          vcs_type: github
          enable_pr_comment: false
          requires: [orb-release-container, orb-release-pack, orb-release-ensure-registered-jerus-org]
          context: [orb-publishing]
          filters:
            tags:
              only: /^gen-circleci-orb-v.*/
            branches:
              ignore: /.*/

      - gen-orb-mcp/build_mcp_server:
          name: build-mcp-server
          binary_name: gen-circleci-orb
          tag_prefix: gen-circleci-orb-v
          orb_path: orb/src/@orb.yml
          earliest_version: "0.0.11"
          requires: [publish-orb-jerus-org]
          context: [release, bot-check, pcu-app]
          filters:
            tags:
              only: /^gen-circleci-orb-v.*/
            branches:
              ignore: /.*/
  # <<< gen-circleci-orb

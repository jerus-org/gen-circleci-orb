version: 2.1

parameters:
  gen_circleci_orb_version:
    type: string
    default: ""
    description: "Override crate version (empty = nextsv auto-detect)"
  workspace_version:
    type: string
    default: ""
    description: "Override workspace v* version (empty = nextsv auto-detect)"

orbs:
  toolkit: jerus-org/circleci-toolkit@8.0.3
  orb-tools: circleci/orb-tools@12.5.0
  # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
  gen-circleci-orb: jerus-org/gen-circleci-orb@0.2.4
  # <<< gen-circleci-orb
workflows:
  # release.yml runs ONLY the crate release. release_crate pushes the
  # gen-circleci-orb-v* tag, which triggers the tag-gated `orb-release` workflow
  # in config.yml (build + verify + pack + container + register + publish orb +
  # build MCP server). Keeping orb publishing out of here avoids
  # double-publishing. The release gate jobs (managed block below) check, pack
  # and review the orb before approve-release can be given.
  release:
    jobs:
      - toolkit/calculate_versions:
          name: calculate-versions
          crates: "gen-circleci-orb:gen-circleci-orb-v"
          crate_version_overrides: "gen-circleci-orb:<< pipeline.parameters.gen_circleci_orb_version >>"
          workspace_version_override: << pipeline.parameters.workspace_version >>

      - approve-release:
          type: approval
          # release-gate-review-orb: the orb about to be released is checked,
          # packed and reviewed before approval (gen-circleci-orb#462).
          requires: [calculate-versions, release-gate-review-orb]

      - toolkit/release_crate:
          name: release-gen-circleci-orb
          requires: [approve-release]
          package: gen-circleci-orb
          crate_tag_prefix: gen-circleci-orb-v
          build_binary: true
          binary_name: gen-circleci-orb
          context:
            - release
            - bot-check
            - pcu-app

      - toolkit/release_prlog:
          requires: [release-gen-circleci-orb]
          context:
            - release
            - bot-check
            - pcu-app
      # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
      - gen-circleci-orb/build_rust_binary:
          name: release-gate-build-binary
          package: gen-circleci-orb
          executor: toolkit/rust_env_rolling
      - gen-circleci-orb/generate:
          name: release-gate-check-orb
          binary: gen-circleci-orb
          orb_namespace: jerus-org
          orb_dir: orb
          attach_workspace: true
          check: true
          requires: [release-gate-build-binary]
      - orb-tools/pack:
          name: release-gate-pack-orb
          source_dir: orb/src
          requires: [release-gate-check-orb]
      - orb-tools/review:
          name: release-gate-review-orb
          source_dir: orb/src
          requires: [release-gate-pack-orb]
      # <<< gen-circleci-orb

# cargo-about configuration for generating THIRD-PARTY-LICENSES.md.
# cargo-about does NOT read deny.toml, so this list states the same policy a
# second time and the two can drift apart in silence. Keep them in step: this
# is permissive licences plus MPL-2.0, carried by one transitive helper.
# LGPL-2.0-or-later was dropped when pcu's `attest` feature was gated off and
# the OpenPGP stack (sequoia-openpgp, buffered-reader) left the graph with it.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# Notices cover what ships in the binary: dev-only dependencies (test harness,
# etc.) are not distributed, so they are excluded.
ignore-dev-dependencies = true

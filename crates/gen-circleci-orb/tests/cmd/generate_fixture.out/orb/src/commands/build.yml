description: Build a target, with a name, format and verbosity controls
parameters:
  target:
    type: string
    description: Build target
  build_name:
    type: string
    description: Human-readable name for this build
  format:
    type: enum
    description: Output format
    default: text
    enum:
    - text
    - json
  log_level:
    type: enum
    description: 'Logging verbosity: consolidates this tool''s clap-verbosity-flag -q/--quiet and -v/--verbose repeat-counters (its own linked pair) into one selector, so they can''t be set independently and cancel out. clap-verbosity-flag escalates off -> error -> warn -> info -> debug -> trace, typically starting at error: `quiet` is a single -q (one step quieter); `default` is this tool''s own starting point on that scale; `v` / `vv` / `vvv` / `vvvv` are -v / -vv / -vvv / -vvvv (one to four steps louder).'
    default: default
    enum:
    - quiet
    - default
    - v
    - vv
    - vvv
    - vvvv
steps:
- run:
    name: Build a target, with a name, format and verbosity controls
    command: <<include(scripts/build.sh)>>
    environment:
      TARGET: << parameters.target >>
      BUILD_NAME: << parameters.build_name >>
      FORMAT: << parameters.format >>
      LOG_LEVEL: << parameters.log_level >>

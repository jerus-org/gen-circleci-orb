[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities are always denied by cargo-deny. unmaintained/unsound are
# scope selectors ("all" | "workspace" | "transitive" | "none"); "all" checks
# every crate in the graph and reports them as warnings.
unmaintained = "all"
yanked = "warn"
ignore = [
    # Interim: unsafe-libyaml (via the deprecated serde_yaml) is unmaintained.
    # Remove when jerus-org/gen-circleci-orb#507 closes.
    "RUSTSEC-2024-0449",
    # RUSTSEC-2026-0543: chrono is unmaintained (informational; every version is
    # affected and no patched release exists). Not used by this crate's own code:
    # it reaches the graph only through pcu (a direct dependency), directly and
    # via keep-a-changelog, link-bridge and octocrab. Remove when pcu no longer
    # depends on chrono. Tracked: jerus-org/pcu#1153.
    "RUSTSEC-2026-0543",
    # RUSTSEC-2026-0542: humantime is unmaintained (it wraps chrono; no patched
    # release exists). Dev-dependency only: trycmd (the CLI snapshot tests) ->
    # humantime-serde -> humantime, so it is not in the shipped binary, the orb or
    # the image. Remove when trycmd no longer depends on humantime. See
    # https://rustsec.org/advisories/RUSTSEC-2026-0542.
    "RUSTSEC-2026-0542",
]

[licenses]
# All licenses are denied unless explicitly allowed. Permissive licenses are
# allowed globally; weak-copyleft licenses are NOT — they are scoped to the
# specific transitive crates that carry them via [[licenses.exceptions]] below,
# so a new copyleft dependency fails the check until consciously reviewed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

# MPL-2.0 (file-level copyleft): transitive config/dirs helper.
[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
# `rsa` carries an unfixed advisory (RUSTSEC-2023-0071) and reaches this graph
# only through pcu's `attest` feature, which this crate does not use. The ban
# exists so that anything reintroducing `rsa` forces a check of its advisory
# state and a decision — a different solution, or an exception if warranted.
# Local guard: CI does not run cargo-deny yet (#260).
deny = [{ name = "rsa" }]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
